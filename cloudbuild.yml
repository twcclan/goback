steps:
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker login --username=$${_DOCKER_HUB_USERNAME} --password=$${_DOCKER_HUB_PASSWORD}']
    secretEnv: ['_DOCKER_HUB_USERNAME', '_DOCKER_HUB_PASSWORD']
  # a tag build pushes the tag's name, a branch build pushes latest
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args: ['-c', 'docker build -t twcclan/goback:$${TAG:-latest} . && docker push twcclan/goback:$${TAG:-latest}']
    env: ['TAG=$TAG_NAME']
