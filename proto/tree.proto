syntax = "proto3";

package proto;

option go_package = "github.com/twcclan/goback/proto";

import "file.proto";
import "ref.proto";

message Tree {
  repeated TreeNode nodes = 1;

  // an ordered list of tree objects whose nodes, concatenated, form this
  // tree; set instead of nodes for directories above the fan-out limit
  repeated Ref splits = 2;
}

message TreeNode {
    // contains info about whether this is a file or a directory (tree)
    FileInfo stat = 1;
    Ref ref = 2;
}
