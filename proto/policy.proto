syntax = "proto3";

package proto;

option go_package = "github.com/twcclan/goback/proto";

import "ref.proto";

// Policy is the full state of one scope after a change the store's index
// made to it. A reindex replays a store's policies in order of sequence,
// then of written_at. Only the store writes these.
message Policy {
  // increases with every change the store makes
  uint64 sequence = 1;
  int64 written_at_ns = 2;

  oneof scope {
    StoreScope store = 3;
    SetScope set = 4;
    CommitScope commit = 5;
  }
}

// StoreScope is the store's settings.
message StoreScope {
  // the write policy as JSON, empty for the default
  string write_policy = 1;
  uint32 write_policy_version = 2;
  // when the operator confirmed saving the store key; 0 for never
  int64 key_acknowledged_at_ns = 3;
  // the default retention policy as JSON, empty for the built-in one
  string default_retention = 4;
  // ignored: policies stored with it keep their hash
  uint32 hold_days = 5;
  uint32 trash_days = 6;
}

enum SetState {
  SET_ACTIVE = 0;
  SET_CLOSING = 1;
  SET_DELETED = 2;
}

// SetScope is one set's retention and lifecycle.
message SetScope {
  uint64 set_id = 1;
  string name = 2;
  // the set's own retention policy as JSON, empty to inherit the default
  string retention = 3;
  bool retention_paused = 4;
  SetState state = 5;
  bool erase = 6;
  // when the set was deleted, which moved its live commits to the trash;
  // 0 unless it is closing
  int64 closed_at_ns = 7;
}

// CommitScope is whether a commit is in the trash.
message CommitScope {
  Ref commit = 1;
  // when it was moved to the trash; 0 when it is not there
  int64 deleted_at_ns = 2;
}
