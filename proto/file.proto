syntax = "proto3";

package proto;

option go_package = "github.com/twcclan/goback/proto";

import "ref.proto";

// NodeType says what kind of filesystem entry a tree node describes.
enum NodeType {
	NODE_FILE = 0;
	NODE_DIRECTORY = 1;
	NODE_SYMLINK = 2;
}

// this contains file metadata, which can be different
// accross backups, even if file content is the same
// Name, user, group and link_target are plaintext bytes in an unencrypted
// store and deterministic tokens under the store key otherwise.
message FileInfo {
	bytes name = 1;
	uint32 mode = 2;
	bytes user = 3;
	bytes group = 4;
	reserved 5, 7;
	reserved "timestamp", "tree";
	int64 size = 6;

	// modification time in nanoseconds since the Unix epoch
	int64 mtime_ns = 8;
	NodeType type = 9;

	// the target of a symlink, empty for every other type
	bytes link_target = 10;
}

// Chunker names the boundary function and parameters that cut a file.
enum Chunker {
	// FastCDC with a 16 KiB minimum, 64 KiB target and 256 KiB maximum
	FASTCDC_64K = 0;
}

message File {
	// an ordered list of file parts
	repeated FilePart parts = 1;

	// an ordered list of references to other file objects
	repeated Ref splits = 2;

	// the chunker that cut the parts
	Chunker chunker = 3;

	// the whole content of a small file, stored without a blob; sealed
	// under the key in keys when the store is encrypted
	bytes inline = 4;

	// the per-part blob keys (one 32-byte key per part, or one for inline
	// content), encrypted under the store key; empty in a plaintext store
	bytes keys = 5;
}

message FilePart {
	uint64 offset = 1;
	uint64 length = 2;
	Ref ref = 3;
}
