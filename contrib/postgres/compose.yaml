name: goback-postgres

services:
  # copies goback into the volume the Postgres container runs it from, on
  # every `docker compose up`
  goback-bin:
    image: goback
    build: ../..
    entrypoint:
      - sh
      - -c
      - cp /root/binary /opt/goback/goback && mkdir -p /var/lib/goback/spool && chown -R 999:999 /var/lib/goback
    volumes:
      - goback-bin:/opt/goback
      - goback:/var/lib/goback

  postgres:
    image: postgres:17
    # tini as PID 1 reaps what the jobs leave behind; the postmaster restarts
    # the whole cluster when an unknown child of it dies abnormally
    init: true
    depends_on:
      goback-bin:
        condition: service_completed_successfully
    command:
      - -c
      - archive_mode=on
      - -c
      - archive_command=/opt/goback/goback postgres archive %p %f
      # a quiet cluster still ships its last minute
      - -c
      - archive_timeout=60
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp-credentials
      GOBACK_POSTGRES_SPOOL: /var/lib/goback/spool
      PGHOST: /var/run/postgresql
    secrets:
      - goback-key
      - gcp-credentials
      - postgres-password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - goback-bin:/opt/goback:ro
      - goback:/var/lib/goback
    # Ofelia runs these in this container; job names are host-wide
    labels:
      ofelia.enabled: "true"
      ofelia.job-exec.pg-base.schedule: "@daily"
      ofelia.job-exec.pg-base.user: postgres
      ofelia.job-exec.pg-base.no-overlap: "true"
      # each job keeps its own copy of the bucket's archive index, so the two
      # can run at the same time
      ofelia.job-exec.pg-base.command: /opt/goback/goback --storage gcs://BUCKET?index=/var/lib/goback/archives-base --index /var/lib/goback/index --store-key /run/secrets/goback-key --agent-id db --set db-base postgres base
      ofelia.job-exec.pg-wal.schedule: "@every 1m"
      ofelia.job-exec.pg-wal.user: postgres
      ofelia.job-exec.pg-wal.no-overlap: "true"
      ofelia.job-exec.pg-wal.command: /opt/goback/goback --storage gcs://BUCKET?index=/var/lib/goback/archives-wal --index /var/lib/goback/index --store-key /run/secrets/goback-key --agent-id db --set db-wal postgres wal --base-set db-base

  ofelia:
    image: mcuadros/ofelia:latest
    depends_on:
      - postgres
    command: daemon --docker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

secrets:
  goback-key:
    file: ./goback.key
  gcp-credentials:
    file: ./gcp-credentials.json
  postgres-password:
    file: ./postgres-password

volumes:
  pgdata:
  goback-bin:
  goback:
